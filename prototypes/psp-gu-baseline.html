<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSP GU Baseline — Q16.16 Bezier Patches & 8-Bit CLUT EDRAM</title>
  <style>
    :root {
      --bg: #080a0f;
      --panel: #111520;
      --border: #252d40;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 12px;
    }
    header { text-align: center; max-width: 740px; }
    h1 { font-size: 1.02rem; margin: 0 0 4px; letter-spacing: 0.05em; color: var(--accent); }
    p { margin: 0; font-size: 0.78rem; color: var(--muted); }
    .psp-bezel {
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #161b28 0%, #0b0e16 100%);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    canvas#pspScreen {
      display: block;
      width: 720px;
      max-width: 92vw;
      height: auto;
      aspect-ratio: 480 / 272;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border: 1px solid #2e374d;
      background: #05070c;
    }
    .clut-strip {
      width: 100%;
      height: 12px;
      image-rendering: pixelated;
      border: 1px solid #2e374d;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 740px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
    }
    button, select {
      background: #1a2030;
      color: var(--text);
      border: 1px solid #35405c;
      border-radius: 4px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }
    button:hover, select:hover { border-color: var(--accent); }
    button.active { background: #2b1f4d; border-color: var(--accent); color: #ddd6fe; }
    .hud { font-size: 0.72rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>PSP GRAPHICS ENGINE BASELINE (480×272 WIDESCREEN · Q16.16 ZERO-FLOAT)</h1>
    <p>Hardware-Style Bicubic Bezier Tessellation (sceGuPatchPrim) + 8-Bit EDRAM &amp; 256-Color CLUT Cycling</p>
  </header>

  <div class="psp-bezel">
    <canvas id="pspScreen" width="480" height="272"></canvas>
    <canvas id="clutVis" class="clut-strip" width="256" height="1" title="Live 256-Entry CLUT Palette"></canvas>
  </div>

  <div class="controls">
    <select id="selPalette" title="CLUT Theme">
      <option value="aurora">CLUT Theme: Borealis Aurora (Cyan/Violet)</option>
      <option value="sakura">CLUT Theme: Kyoto Lantern (Crimson/Gold)</option>
      <option value="abyss">CLUT Theme: Bioluminescent Abyss (Emerald/Cobalt)</option>
    </select>
    <select id="selTess" title="Bezier Tessellation Grid">
      <option value="12">Bezier Tessellation: 12×12 (288 Tris)</option>
      <option value="16" selected>Bezier Tessellation: 16×16 (512 Tris)</option>
      <option value="20">Bezier Tessellation: 20×20 (800 Tris)</option>
    </select>
    <button id="btnCycle" class="active">CLUT Palette Cycling: ON</button>
    <button id="btnWire" class="active">GU Rim Highlight: ON</button>
  </div>

  <div class="hud" id="hud">Frame: 0 | Native Res: 480×272 | EDRAM Index Buffer: 130.5 KB + 1 KB CLUT</div>

  <script>
    // ========================================================================
    // 1. DETERMINISTIC Q16.16 FIXED-POINT MATH & TRIGONOMETRY
    // ========================================================================
    const SHIFT = 16;
    const ONE = 1 << SHIFT;

    function mulQ16(a, b) {
      return Number((BigInt(a) * BigInt(b)) >> 16n) | 0;
    }

    function ceilDiv(a, b) {
      return a >= 0 ? ((a + b - 1) / b) | 0 : (a / b) | 0;
    }

    // Deterministic 1024-brad integer Bhaskara sine/cosine LUT
    const SIN_LUT = new Int32Array(1024);
    (() => {
      for (let i = 0; i <= 256; i++) {
        const x = BigInt(i * 9000) / 256n;
        const term = x * (18000n - x);
        const val = Number((4n * term * 65536n) / (405000000n - term)) | 0;
        SIN_LUT[i] = val;
        SIN_LUT[512 - i] = val;
        SIN_LUT[512 + i] = -val;
        SIN_LUT[(1024 - i) & 1023] = -val;
      }
    })();

    const sinQ16 = (a) => SIN_LUT[a & 1023];
    const cosQ16 = (a) => SIN_LUT[(a + 256) & 1023];

    function buildRotationMatrixQ16(rx, ry, rz) {
      const sx = sinQ16(rx), cx = cosQ16(rx);
      const sy = sinQ16(ry), cy = cosQ16(ry);
      const sz = sinQ16(rz), cz = cosQ16(rz);
      const sxsy = mulQ16(sx, sy);
      const cxsy = mulQ16(cx, sy);
      return new Int32Array([
        mulQ16(cy, cz) + mulQ16(sxsy, sz), mulQ16(-cy, sz) + mulQ16(sxsy, cz), mulQ16(sy, cx),
        mulQ16(cx, sz), mulQ16(cx, cz), -sx,
        mulQ16(-sy, cz) + mulQ16(cxsy, sz), mulQ16(sy, sz) + mulQ16(cxsy, cz), mulQ16(cx, cy)
      ]);
    }

    // ========================================================================
    // 2. PSP EDRAM 8-BIT INDEXED FRAMEBUFFER & 256-COLOR CLUT ENGINE
    // ========================================================================
    const W = 480;
    const H = 272;
    const indexBuf = new Uint8Array(W * H);
    const zBuf = new Int32Array(W * H);
    const baseCLUT = new Uint32Array(256);
    const activeCLUT = new Uint32Array(256);

    function packABGR(r, g, b) {
      const cr = r < 0 ? 0 : r > 255 ? 255 : r;
      const cg = g < 0 ? 0 : g > 255 ? 255 : g;
      const cb = b < 0 ? 0 : b > 255 ? 255 : b;
      return ((255 << 24) | (cb << 16) | (cg << 8) | cr) >>> 0;
    }

    function buildCLUTTheme(theme) {
      for (let i = 0; i < 32; i++) {
        const t = i << 3;
        if (theme === "sakura") {
          baseCLUT[i] = packABGR(14 + (t >> 3), 8 + (t >> 5), 22 + (t >> 3));
        } else if (theme === "abyss") {
          baseCLUT[i] = packABGR(4 + (t >> 5), 12 + (t >> 3), 26 + (t >> 2));
        } else {
          baseCLUT[i] = packABGR(8 + (t >> 4), 10 + (t >> 4), 24 + (t >> 2));
        }
      }
      for (let i = 0; i < 208; i++) {
        const phase = ((i * 1024) / 208) | 0;
        const w1 = (sinQ16(phase) + ONE) >> 9;
        const w2 = (cosQ16(phase * 2) + ONE) >> 9;
        if (theme === "sakura") {
          baseCLUT[32 + i] = packABGR(70 + ((w1 * 180) >> 8), 24 + ((w2 * 150) >> 8), 55 + ((w1 * 95) >> 8));
        } else if (theme === "abyss") {
          baseCLUT[32 + i] = packABGR(12 + ((w2 * 70) >> 8), 65 + ((w1 * 185) >> 8), 110 + ((w2 * 140) >> 8));
        } else {
          baseCLUT[32 + i] = packABGR(35 + ((w2 * 165) >> 8), 75 + ((w1 * 175) >> 8), 135 + ((w1 * 115) >> 8));
        }
      }
      for (let i = 0; i < 16; i++) {
        const glow = 160 + (i * 6);
        baseCLUT[240 + i] = packABGR(glow, glow, Math.min(255, glow + 20));
      }
      activeCLUT.set(baseCLUT);
    }

    function updateCLUTCycle(shiftOffset) {
      const span = 208;
      const offset = ((shiftOffset % span) + span) % span;
      for (let i = 0; i < 32; i++) activeCLUT[i] = baseCLUT[i];
      for (let i = 0; i < span; i++) {
        activeCLUT[32 + i] = baseCLUT[32 + ((i + offset) % span)];
      }
      for (let i = 240; i < 256; i++) activeCLUT[i] = baseCLUT[i];
    }

    // ========================================================================
    // 3. HARDWARE-STYLE BICUBIC BEZIER PATCH TESSELLATION (Q16.16)
    // ========================================================================
    function evalCubicBezierQ16(p0, p1, p2, p3, tQ16) {
      const invT = ONE - tQ16;
      const a0 = mulQ16(p0, invT) + mulQ16(p1, tQ16);
      const a1 = mulQ16(p1, invT) + mulQ16(p2, tQ16);
      const a2 = mulQ16(p2, invT) + mulQ16(p3, tQ16);
      const b0 = mulQ16(a0, invT) + mulQ16(a1, tQ16);
      const b1 = mulQ16(a1, invT) + mulQ16(a2, tQ16);
      return mulQ16(b0, invT) + mulQ16(b1, tQ16);
    }

    const colX = new Int32Array(4);
    const colY = new Int32Array(4);
    const colZ = new Int32Array(4);

    function evalBicubicPatchQ16(ctrlGrid, uQ16, vQ16) {
      for (let row = 0; row < 4; row++) {
        const base = row * 4;
        const p0 = ctrlGrid[base];
        const p1 = ctrlGrid[base + 1];
        const p2 = ctrlGrid[base + 2];
        const p3 = ctrlGrid[base + 3];
        colX[row] = evalCubicBezierQ16(p0.x, p1.x, p2.x, p3.x, uQ16);
        colY[row] = evalCubicBezierQ16(p0.y, p1.y, p2.y, p3.y, uQ16);
        colZ[row] = evalCubicBezierQ16(p0.z, p1.z, p2.z, p3.z, uQ16);
      }
      return {
        x: evalCubicBezierQ16(colX[0], colX[1], colX[2], colX[3], vQ16),
        y: evalCubicBezierQ16(colY[0], colY[1], colY[2], colY[3], vQ16),
        z: evalCubicBezierQ16(colZ[0], colZ[1], colZ[2], colZ[3], vQ16)
      };
    }

    // ========================================================================
    // 4. PSP Z-BUFFERED INDEXED TRIANGLE RASTERIZER (GOURAUD PALETTE INDEX)
    // ========================================================================
    function drawIndexedZTriangle(v0, v1, v2, rimHighlight) {
      if (v1.y < v0.y) { const t = v0; v0 = v1; v1 = t; }
      if (v2.y < v0.y) { const t = v0; v0 = v2; v2 = t; }
      if (v2.y < v1.y) { const t = v1; v1 = v2; v2 = t; }

      const totalH = v2.y - v0.y;
      if (totalH <= 0) return;

      const dxLong = (((v2.x - v0.x) << SHIFT) / totalH) | 0;
      const dzLong = ((v2.z - v0.z) / totalH) | 0;
      const dcLong = (((v2.c - v0.c) << SHIFT) / totalH) | 0;
let xLong = v0.x << SHIFT, zLong = v0.z, cLong = v0.c << SHIFT;
for (let half = 0; half < 2; half++) {
const startV = half === 0 ? v0 : v1;
const endV = half === 0 ? v1 : v2;
const segH = endV.y - startV.y;
if (segH <= 0) continue;
const dxShort = (((endV.x - startV.x) << SHIFT) / segH) | 0;
const dzShort = ((endV.z - startV.z) / segH) | 0;
const dcShort = (((endV.c - startV.c) << SHIFT) / segH) | 0;
let xShort = startV.x << SHIFT, zShort = startV.z, cShort = startV.c << SHIFT;
for (let y = startV.y; y < endV.y; y++) {
if (y >= 0 && y < H) {
let xl = xLong, xr = xShort, zl = zLong, zr = zShort, cl = cLong, cr = cShort;
if (xl > xr) {
let t = xl; xl = xr; xr = t;
t = zl; zl = zr; zr = t;
t = cl; cl = cr; cr = t;
}
const xStart = Math.max(0, ceilDiv(xl, ONE));
const xEnd = Math.min(W, ceilDiv(xr, ONE));
const span = (xr - xl) >> SHIFT;
if (xEnd > xStart && span > 0) {
const dz = ((zr - zl) / span) | 0;
const dc = ((cr - cl) / span) | 0;
const preStep = BigInt((xStart << SHIFT) - xl);
let z = zl + Number((BigInt(dz) * preStep) >> 16n);
let c = cl + Number((BigInt(dc) * preStep) >> 16n);
const rowOff = y * W;
for (let x = xStart; x < xEnd; x++) {
const idx = rowOff + x;
if (z < zBuf[idx]) {
zBuf[idx] = z;
if (rimHighlight && (x === xStart || x === xEnd - 1 || y === startV.y)) {
indexBuf[idx] = 248;
} else {
const palIdx = c >> SHIFT;
indexBuf[idx] = palIdx < 32 ? 32 : palIdx > 239 ? 239 : palIdx;
}
}
z += dz;
c += dc;
}
}
}
xLong += dxLong; zLong += dzLong; cLong += dcLong;
xShort += dxShort; zShort += dzShort; cShort += dcShort;
}
}
}
// ========================================================================
// 5. MAIN LOOP: ANIMATE 4x4 CONTROL GRID, TESSELLATE, & RESOLVE CLUT
// ========================================================================
const screenCanvas = document.getElementById("pspScreen");
const screenCtx = screenCanvas.getContext("2d", { alpha: false });
const imgData = screenCtx.createImageData(W, H);
const out32 = new Uint32Array(imgData.data.buffer);
const clutCanvas = document.getElementById("clutVis");
const clutCtx = clutCanvas.getContext("2d");
const clutImg = clutCtx.createImageData(256, 1);
const clut32 = new Uint32Array(clutImg.data.buffer);
const hudEl = document.getElementById("hud");
let tessSteps = 16;
let cycleEnabled = true;
let rimEnabled = true;
let frameTick = 0;
buildCLUTTheme("aurora");
document.getElementById("selPalette").addEventListener("change", (e) => buildCLUTTheme(e.target.value));
document.getElementById("selTess").addEventListener("change", (e) => { tessSteps = parseInt(e.target.value, 10); });
const btnCycle = document.getElementById("btnCycle");
btnCycle.addEventListener("click", () => {
cycleEnabled = !cycleEnabled;
btnCycle.textContent = cycleEnabled ? "CLUT Palette Cycling: ON" : "CLUT Palette Cycling: OFF";
btnCycle.classList.toggle("active", cycleEnabled);
});
const btnWire = document.getElementById("btnWire");
btnWire.addEventListener("click", () => {
rimEnabled = !rimEnabled;
btnWire.textContent = rimEnabled ? "GU Rim Highlight: ON" : "GU Rim Highlight: OFF";
btnWire.classList.toggle("active", rimEnabled);
});
const ctrlGrid = Array.from({ length: 16 }, () => ({ x: 0, y: 0, z: 0 }));
function renderFrame() {
zBuf.fill(0x7FFFFFFF);
for (let y = 0; y < H; y++) {
indexBuf.fill((y * 31 / H) | 0, y * W, (y + 1) * W);
}
for (let r = 0; r < 4; r++) {
for (let c = 0; c < 4; c++) {
const i = r * 4 + c;
const baseX = ((c - 1.5) * 1.15 * ONE) | 0;
const baseZ = ((r - 1.5) * 1.15 * ONE) | 0;
const wavePhase = (frameTick * 7 + r * 190 + c * 230) & 1023;
const ripplePhase = (frameTick * 5 - r * 140 + c * 170) & 1023;
const isInterior = (r === 1 || r === 2) && (c === 1 || c === 2);
const ampShift = isInterior ? 0 : 1;
ctrlGrid[i].x = baseX + (sinQ16(ripplePhase) >> 3);
ctrlGrid[i].y = (sinQ16(wavePhase) >> (1 + ampShift)) + (cosQ16(ripplePhase) >> 2);
ctrlGrid[i].z = baseZ + (cosQ16(wavePhase) >> 3);
}
}
const rx = 210 + (sinQ16((frameTick * 2) & 1023) >> 11);
const ry = (frameTick * 2) & 1023;
const mat = buildRotationMatrixQ16(rx, ry, 0);
const camPos = { x: 0, y: 0, z: (4.4 * ONE) | 0 };
const focalQ16 = 310 << 16;
const halfW = W >> 1;
const halfH = H >> 1;
const stride = tessSteps + 1;
const gridVerts = new Array(stride * stride);
for (let iv = 0; iv <= tessSteps; iv++) {
const vQ16 = ((iv << SHIFT) / tessSteps) | 0;
for (let iu = 0; iu <= tessSteps; iu++) {
const uQ16 = ((iu << SHIFT) / tessSteps) | 0;
const pt = evalBicubicPatchQ16(ctrlGrid, uQ16, vQ16);
const tx = mulQ16(mat[0], pt.x) + mulQ16(mat[1], pt.y) + mulQ16(mat[2], pt.z) + camPos.x;
const ty = mulQ16(mat[3], pt.x) + mulQ16(mat[4], pt.y) + mulQ16(mat[5], pt.z) + camPos.y;
const tz = mulQ16(mat[6], pt.x) + mulQ16(mat[7], pt.y) + mulQ16(mat[8], pt.z) + camPos.z;
if (tz <= ONE) {
gridVerts[iv * stride + iu] = null;
continue;
}
const sx = Number((BigInt(tx) * BigInt(focalQ16)) / BigInt(tz)) >> SHIFT;
const sy = Number((BigInt(ty) * BigInt(focalQ16)) / BigInt(tz)) >> SHIFT;
const heightBias = pt.y >> 10;
const uvWave = ((iu + iv) * 208 / (tessSteps * 2)) | 0;
const palIndex = 32 + (((uvWave + heightBias) % 208 + 208) % 208);
gridVerts[iv * stride + iu] = {
x: (sx + halfW) | 0,
y: (sy + halfH) | 0,
z: tz,
c: palIndex
};
}
}
for (let iv = 0; iv < tessSteps; iv++) {
for (let iu = 0; iu < tessSteps; iu++) {
const p00 = gridVerts[iv * stride + iu];
const p10 = gridVerts[iv * stride + (iu + 1)];
const p01 = gridVerts[(iv + 1) * stride + iu];
const p11 = gridVerts[(iv + 1) * stride + (iu + 1)];
if (!p00 || !p10 || !p01 || !p11) continue;
drawIndexedZTriangle(p00, p10, p11, rimEnabled);
drawIndexedZTriangle(p00, p11, p01, rimEnabled);
}
}
if (cycleEnabled) updateCLUTCycle(frameTick >> 1);
for (let i = 0; i < W * H; i++) {
out32[i] = activeCLUT[indexBuf[i]];
}
screenCtx.putImageData(imgData, 0, 0);
clut32.set(activeCLUT);
clutCtx.putImageData(clutImg, 0, 0);
if ((frameTick & 15) === 0) {
const tris = tessSteps * tessSteps * 2;
hudEl.textContent = "Frame: " + frameTick + " | Res: 480×272 | Bezier Grid: " + tessSteps + "×" + tessSteps + " (" + tris + " tris) | CLUT Cycle: " + (cycleEnabled ? "Active" : "Paused");
}
frameTick++;
requestAnimationFrame(renderFrame);
}
requestAnimationFrame(renderFrame);
