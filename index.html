  <script>
    const SHIFT = 16, ONE = 1 << SHIFT;
    const mulQ16 = (a, b) => Number((BigInt(a) * BigInt(b)) >> 16n) | 0;
    const ceilDiv = (a, b) => a >= 0 ? ((a + b - 1) / b) | 0 : (a / b) | 0;

    const SIN_LUT = new Int32Array(1024);
    (() => {

    function buildRotationMatrixQ16(rx, ry, rz) {
      const sx = sinQ16(rx), cx = cosQ16(rx);

        mulQ16(cy, cz) + mulQ16(sxsy, sz), mulQ16(-cy, sz) + mulQ16(sxsy, cz), mulQ16(sy, cx),

        mulQ16(-sy, cz) + mulQ16(cxsy, sz), mulQ16(sy, sz) + mulQ16(cxsy, cz), mulQ16(cx, cy)

        else if (theme === "abyss") baseCLUT[32 + i] = packABGR(12 + ((w2 * 70) >> 8), 65 + ((w1 * 185) >> 8), 110 + ((w2 * 140) >> 8));
        else baseCLUT[32 + i] = packABGR(35 + ((w2 * 165) >> 8), 75 + ((w1 * 175) >> 8), 135 + ((w1 * 115) >> 8));
      }
      for (let i = 0; i < 16; i++) {
        const glow = 160 + (i * 6);
        baseCLUT[240 + i] = packABGR(glow, glow, Math.min(255, glow + 20));
      }
      activeCLUT.set(baseCLUT);
    }

    function updateCLUTCycle(shiftOffset) {
      const span = 208, offset = ((shiftOffset % span) + span) % span;
      for (let i = 0; i < 32; i++) activeCLUT[i] = baseCLUT[i];
      for (let i = 0; i < span; i++) activeCLUT[32 + i] = baseCLUT[32 + ((i + offset) % span)];
      for (let i = 240; i < 256; i++) activeCLUT[i] = baseCLUT[i];
    }

    function evalCubicBezierQ16(p0, p1, p2, p3, tQ16) {
      const invT = ONE - tQ16;
      const a0 = mulQ16(p0, invT) + mulQ16(p1, tQ16);
      const a1 = mulQ16(p1, invT) + mulQ16(p2, tQ16);
      const a2 = mulQ16(p2, invT) + mulQ16(p3, tQ16);
      const b0 = mulQ16(a0, invT) + mulQ16(a1, tQ16);
      const b1 = mulQ16(a1, invT) + mulQ16(a2, tQ16);
      return mulQ16(b0, invT) + mulQ16(b1, tQ16);
    }

    function evalBicubicPatchQ16(ctrlGrid, uQ16, vQ16) {
      const colX = new Int32Array(4), colY = new Int32Array(4), colZ = new Int32Array(4);
      for (let row = 0; row < 4; row++) {
        const base = row * 4;
        const p0 = ctrlGrid[base], p1 = ctrlGrid[base + 1], p2 = ctrlGrid[base + 2], p3 = ctrlGrid[base + 3];
        colX[row] = evalCubicBezierQ16(p0.x, p1.x, p2.x, p3.x, uQ16);
        colY[row] = evalCubicBezierQ16(p0.y, p1.y, p2.y, p3.y, uQ16);
        colZ[row] = evalCubicBezierQ16(p0.z, p1.z, p2.z, p3.z, uQ16);
      }
      return {
        x: evalCubicBezierQ16(colX, colX, colX, colX, vQ16),
        y: evalCubicBezierQ16(colY, colY, colY, colY, vQ16),
        z: evalCubicBezierQ16(colZ, colZ, colZ, colZ, vQ16)
      };
    }

    const touchOffsetY = new Int32Array(16), touchVelY = new Int32Array(16);
    function stepTactileSprings() {
      for (let i = 0; i < 16; i++) {
        const force = -(touchOffsetY[i] >> 5) - (touchVelY[i] >> 3);
        touchVelY[i] += force;
        touchOffsetY[i] += touchVelY[i];
      }
    }

    function drawIndexedZTriangle(v0, v1, v2, rimHighlight, ditherOn) {
      if (v1.y < v0.y) { const t = v0; v0 = v1; v1 = t; }
      if (v2.y < v0.y) { const t = v0; v0 = v2; v2 = t; }
      if (v2.y < v1.y) { const t = v1; v1 = v2; v2 = t; }
      const totalH = v2.y - v0.y;
      if (totalH <= 0) return;

      const dxLong = (((v2.x - v0.x) << SHIFT) / totalH) | 0;
      const dzLong = ((v2.z - v0.z) / totalH) | 0;
      const dcLong = (((v2.c - v0.c) << SHIFT) / totalH) | 0;
      let xLong = v0.x << SHIFT, zLong = v0.z, cLong = v0.c << SHIFT;

      for (let half = 0; half < 2; half++) {
        const startV = half === 0 ? v0 : v1, endV = half === 0 ? v1 : v2;
        const segH = endV.y - startV.y;
        if (segH <= 0) continue;
        const dxShort = (((endV.x - startV.x) << SHIFT) / segH) | 0;
        const dzShort = ((endV.z - startV.z) / segH) | 0;
        const dcShort = (((endV.c - startV.c) << SHIFT) / segH) | 0;
        let xShort = startV.x << SHIFT, zShort = startV.z, cShort = startV.c << SHIFT;

        for (let y = startV.y; y < endV.y; y++) {
          if (y >= 0 && y < H) {
            let xl = xLong, xr = xShort, zl = zLong, zr = zShort, cl = cLong, cr = cShort;
            if (xl > xr) { let t = xl; xl = xr; xr = t; t = zl; zl = zr; zr = t; t = cl; cl = cr; cr = t; }
            const xStart = Math.max(0, ceilDiv(xl, ONE)), xEnd = Math.min(W, ceilDiv(xr, ONE));
            const span = (xr - xl) >> SHIFT;
            if (xEnd > xStart && span > 0) {
              const dz = ((zr - zl) / span) | 0, dc = ((cr - cl) / span) | 0;
              const preStep = BigInt((xStart << SHIFT) - xl);
              let z = zl + Number((BigInt(dz) * preStep) >> 16n);
              let c = cl + Number((BigInt(dc) * preStep) >> 16n);
              const rowOff = y * W, bayerRow = (y & 3) << 2;
              for (let x = xStart; x < xEnd; x++) {

const idx = rowOff + x;
if (z < zBuf[idx]) {
zBuf[idx] = z;
if (rimHighlight && (x === xStart || x === xEnd - 1 || y === startV.y)) {
indexBuf[idx] = 248;
} else {
const ditherBias = ditherOn ? BAYER_4X4[bayerRow + (x & 3)] : 0;
const palIdx = (c + ditherBias) >> SHIFT;
indexBuf[idx] = palIdx < 32 ? 32 : palIdx > 239 ? 239 : palIdx;
}
}
z += dz; c += dc;
}
}
}
xLong += dxLong; zLong += dzLong; cLong += dcLong;
xShort += dxShort; zShort += dzShort; cShort += dcShort;
}
}
}
let audioCtx = null, audioNode = null, audioActive = false;
const VOICE_PERIODS =;
const voices = VOICE_PERIODS.map(len => ({ buf: new Int16Array(len), ptr: 0 }));
let lfsr = 0xACE1;
function nextNoise16() {
const bit = ((lfsr >> 0) ^ (lfsr >> 2) ^ (lfsr >> 3) ^ (lfsr >> 5)) & 1;
lfsr = (lfsr >> 1) | (bit << 15);
return (lfsr & 0x3FFF) - 0x2000;
}
function pluckVoice(voiceIdx, velocityQ8) {
const v = voices[voiceIdx % voices.length];
for (let i = 0; i < v.buf.length; i++) v.buf[i] = (nextNoise16() * velocityQ8) >> 8;
}
function toggleAudio() {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 22050 });
audioNode = audioCtx.createScriptProcessor(512, 0, 1);
audioNode.onaudioprocess = (e) => {
const out = e.outputBuffer.getChannelData(0);
if (!audioActive) { out.fill(0); return; }
for (let s = 0; s < out.length; s++) {
let mix = 0;
for (let vi = 0; vi < voices.length; vi++) {
const v = voices[vi], len = v.buf.length;
const curr = v.buf[v.ptr], next = v.buf[(v.ptr + 1) % len];
const avg = ((curr + next) * 253) >> 9;
v.buf[v.ptr] = avg; v.ptr = (v.ptr + 1) % len; mix += curr;
}
out[s] = Math.max(-1, Math.min(1, mix / 32768));
}

}
if (audioCtx.state === "suspended") audioCtx.resume();
audioActive = !audioActive;
const btn = document.getElementById("btnAudio");
btn.textContent = audioActive ? "SAS Synth: ON" : "SAS Synth: OFF";
btn.classList.toggle("active", audioActive);

}
const screenCanvas = document.getElementById("pspScreen");
const screenCtx = screenCanvas.getContext("2d", { alpha: false });
const imgData = screenCtx.createImageData(W, H);
const out32 = new Uint32Array(imgData.data.buffer);
const clutCanvas = document.getElementById("clutVis");
const clutCtx = clutCanvas.getContext("2d");
const clutImg = clutCtx.createImageData(256, 1);
const clut32 = new Uint32Array(clutImg.data.buffer);
const hudEl = document.getElementById("hud");
let tessSteps = 16, cycleEnabled = true, ditherEnabled = true, rimEnabled = true;
let frameTick = 0, isPointerDown = false, lastPluckTick = -10;
buildCLUTTheme("aurora");
document.getElementById("selPalette").addEventListener("change", (e) => buildCLUTTheme(e.target.value));
document.getElementById("selTess").addEventListener("change", (e) => { tessSteps = parseInt(e.target.value, 10); });
const btnCycle = document.getElementById("btnCycle");
btnCycle.addEventListener("click", () => { cycleEnabled = !cycleEnabled; btnCycle.textContent = cycleEnabled ? "CLUT Cycle: ON" : "CLUT Cycle: OFF"; btnCycle.classList.toggle("active", cycleEnabled); });
const btnDither = document.getElementById("btnDither");
btnDither.addEventListener("click", () => { ditherEnabled = !ditherEnabled; btnDither.textContent = ditherEnabled ? "4×4 Ordered Dither: ON" : "4×4 Ordered Dither: OFF"; btnDither.classList.toggle("active", ditherEnabled); });
const btnWire = document.getElementById("btnWire");
btnWire.addEventListener("click", () => { rimEnabled = !rimEnabled; btnWire.textContent = rimEnabled ? "GU Rim: ON" : "GU Rim: OFF"; btnWire.classList.toggle("active", rimEnabled); });

function applyTouchImpulse(clientX, clientY) {
const rect = screenCanvas.getBoundingClientRect();
const nx = Math.max(0, Math.min(0.999, (clientX - rect.left) / rect.width));
const ny = Math.max(0, Math.min(0.999, (clientY - rect.top) / rect.height));
const idx = ((ny * 4) | 0) * 4 + ((nx * 4) | 0);
touchVelY[idx] += ((0.5 - ny) * ONE) >> 2;
if (audioActive && frameTick - lastPluckTick >= 6) { pluckVoice(idx, 190); lastPluckTick = frameTick; }
}

screenCanvas.addEventListener("pointermove", (e) => { if (isPointerDown) applyTouchImpulse(e.clientX, e.clientY); });

stepTactileSprings();
zBuf.fill(0x7FFFFFFF);
for (let y = 0; y < H; y++) indexBuf.fill((y * 31 / H) | 0, y * W, (y + 1) * W);

for (let c = 0; c < 4; c++) {
const i = r * 4 + c;
const baseX = ((c - 1.5) * 1.15 * ONE) | 0, baseZ = ((r - 1.5) * 1.15 * ONE) | 0;

const vQ16 = ((iv << SHIFT) / tessSteps) | 0;
for (let iu = 0; iu <= tessSteps; iu++) {
const uQ16 = ((iu << SHIFT) / tessSteps) | 0;

const ty = mulQ16(mat, pt.x) + mulQ16(mat, pt.y) + mulQ16(mat, pt.z) + camPos.y;
const tz = mulQ16(mat, pt.x) + mulQ16(mat, pt.y) + mulQ16(mat, pt.z) + camPos.z;

gridVerts[iv * stride + iu] = { x: (sx + halfW) | 0, y: (sy + halfH) | 0, z: tz, c: palIndex };

drawIndexedZTriangle(p00, p11, p01, rimEnabled, ditherEnabled);
}

screenCtx.putImageData(imgData, 0, 0);
clut32.set(activeCLUT); clutCtx.putImageData(clutImg, 0, 0);

hudEl.textContent = Frame: ${frameTick} | 480×272 | Grid: ${tessSteps}×${tessSteps} (${tessSteps*tessSteps*2} tris) | Dither: ${ditherEnabled ? "4×4" : "OFF"} | SAS: ${audioActive ? "ON" : "OFF"};
}
frameTick++;

}
