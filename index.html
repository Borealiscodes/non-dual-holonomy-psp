<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Non Dual Holonomy PSP</title>
<style>
body{margin:0;min-height:100vh;background:#07090e;color:#e2e8f0;font-family:monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:10px}
canvas{display:block;width:720px;max-width:94vw;aspect-ratio:480/272;image-rendering:pixelated;border:2px solid #2e374d;background:#0b1020;touch-action:none}
#clut{height:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button,select{background:#1a2030;color:#e2e8f0;border:1px solid #3b4766;border-radius:4px;padding:7px 10px;font-family:inherit;font-size:13px}
button.on{background:#2e1d59;border-color:#a78bfa}
#hud{font-size:12px;color:#a78bfa;text-align:center}
</style>
</head>
<body>
<div id="hud">Starting...</div>
<canvas id="scr" width="480" height="272"></canvas>
<canvas id="clut" width="256" height="1"></canvas>
<div class="row">
  <select id="pal"><option value="0">Aurora</option><option value="1">Kyoto</option><option value="2">Abyss</option></select>
  <button id="bCyc" class="on">Cycle: ON</button>
  <button id="bRim" class="on">Rim: ON</button>
  <button id="bSnd">SAS Synth: OFF</button>
</div>
<script>
const W=480,H=272,ONE=65536;
const mul=(a,b)=>Number((BigInt(a)*BigInt(b))>>16n)|0;
const SIN=new Int32Array(1024);
for(let i=0;i<=256;i++){
  const x=BigInt(i*9000)/256n,t=x*(18000n-x);
  const v=Number((4n*t*65536n)/(405000000n-t))|0;
  SIN[i]=SIN[512-i]=v; SIN[512+i]=SIN[(1024-i)&1023]=-v;
}
const sinQ=a=>SIN[a&1023], cosQ=a=>SIN[(a+256)&1023];
const idxB=new Uint8Array(W*H), zB=new Int32Array(W*H);
const bPal=new Uint32Array(256), aPal=new Uint32Array(256);
const abgr=(r,g,b)=>((255<<24)|((b&255)<<16)|((g&255)<<8)|(r&255))>>>0;
function theme(m){
  for(let i=0;i<32;i++){const k=i<<3;bPal[i]=m==1?abgr(16+(k>>3),8,24+(k>>3)):m==2?abgr(4,14+(k>>3),30+(k>>2)):abgr(10+(k>>4),12+(k>>4),28+(k>>2));}
  for(let i=0;i<208;i++){
    const ph=((i*1024)/208)|0,w1=(sinQ(ph)+ONE)>>9,w2=(cosQ(ph*2)+ONE)>>9;
    bPal[32+i]=m==1?abgr(80+((w1*170)>>8),30+((w2*140)>>8),60+((w1*90)>>8)):m==2?abgr(15+((w2*65)>>8),70+((w1*180)>>8),115+((w2*135)>>8)):abgr(40+((w2*160)>>8),80+((w1*170)>>8),140+((w1*110)>>8));
  }
  for(let i=0;i<16;i++)bPal[240+i]=abgr(165+i*5,165+i*5,255);
  aPal.set(bPal);
}
function bez1(p0,p1,p2,p3,t){
  const it=ONE-t,a0=mul(p0,it)+mul(p1,t),a1=mul(p1,it)+mul(p2,t),a2=mul(p2,it)+mul(p3,t);
  return mul(mul(a0,it)+mul(a1,t),it)+mul(mul(a1,it)+mul(a2,t),t);
}
const cx=new Int32Array(4),cy=new Int32Array(4),cz=new Int32Array(4);
function patch(g,u,v){
  for(let r=0;r<4;r++){const b=r*4;cx[r]=bez1(g[b].x,g[b+1].x,g[b+2].x,g[b+3].x,u);cy[r]=bez1(g[b].y,g[b+1].y,g[b+2].y,g[b+3].y,u);cz[r]=bez1(g[b].z,g[b+1].z,g[b+2].z,g[b+3].z,u);}
  return{x:bez1(cx[0],cx[1],cx[2],cx[3],v),y:bez1(cy[0],cy[1],cy[2],cy[3],v),z:bez1(cz[0],cz[1],cz[2],cz[3],v)};
}
function tri(v0,v1,v2,rim){
  if(v1.y<v0.y){let t=v0;v0=v1;v1=t;} if(v2.y<v0.y){let t=v0;v0=v2;v2=t;} if(v2.y<v1.y){let t=v1;v1=v2;v2=t;}
  const th=v2.y-v0.y; if(th<=0)return;
  const dxl=(((v2.x-v0.x)<<16)/th)|0,dzl=((v2.z-v0.z)/th)|0,dcl=(((v2.c-v0.c)<<16)/th)|0;
  let xl=v0.x<<16,zl=v0.z,cl=v0.c<<16;
  for(let h=0;h<2;h++){
    const sv=h?v1:v0,ev=h?v2:v1,sh=ev.y-sv.y; if(sh<=0)continue;
    const dxs=(((ev.x-sv.x)<<16)/sh)|0,dzs=((ev.z-sv.z)/sh)|0,dcs=(((ev.c-sv.c)<<16)/sh)|0;
    let xs=sv.x<<16,zs=sv.z,cs=sv.c<<16;
    for(let y=sv.y;y<ev.y;y++){
      if(y>=0&&y<H){
        let a=xl,b=xs,za=zl,zb=zs,ca=cl,cb=cs;
        if(a>b){let t=a;a=b;b=t;t=za;za=zb;zb=t;t=ca;ca=cb;cb=t;}
        const x0=Math.max(0,a>>16),x1=Math.min(W,b>>16),sp=x1-x0;
        if(sp>0){
          const dz=((zb-za)/sp)|0,dc=((cb-ca)/sp)|0; let z=za,c=ca,row=y*W;
          for(let x=x0;x<x1;x++){
            const idx=row+x;
            if(z<zB[idx]){zB[idx]=z;idxB[idx]=(rim&&(x===x0||x===x1-1||y===sv.y))?248:Math.max(32,Math.min(239,c>>16));}
            z+=dz;c+=dc;
          }
        }
      }
      xl+=dxl;zl+=dzl;cl+=dcl;xs+=dxs;zs+=dzs;cs+=dcs;
    }
  }
}
let actx=null,anode=null,sndOn=false,lfsr=0xACE1;
const voices=[100,89,75,67,56,50,44,37].map(n=>({b:new Int16Array(n),p:0}));
function pluck(vi){
  const v=voices[vi&7];
  for(let i=0;i<v.b.length;i++){const bit=((lfsr>>0)^(lfsr>>2)^(lfsr>>3)^(lfsr>>5))&1;lfsr=(lfsr>>1)|(bit<<15);v.b[i]=((lfsr&0x3FFF)-0x2000)>>1;}
}
const scr=document.getElementById("scr"),ctx=scr.getContext("2d"),img=ctx.createImageData(W,H),out32=new Uint32Array(img.data.buffer);
const ccan=document.getElementById("clut"),cctx=ccan.getContext("2d"),cimg=cctx.createImageData(256,1),cout32=new Uint32Array(cimg.data.buffer);
const hud=document.getElementById("hud");
let cycOn=true,rimOn=true,tick=0,down=false;
const offY=new Int32Array(16),velY=new Int32Array(16),grid=Array.from({length:16},()=>({x:0,y:0,z:0}));
theme(0);
document.getElementById("pal").onchange=e=>theme(+e.target.value);
document.getElementById("bCyc").onclick=function(){cycOn=!cycOn;this.textContent=cycOn?"Cycle: ON":"Cycle: OFF";this.classList.toggle("on",cycOn);};
document.getElementById("bRim").onclick=function(){rimOn=!rimOn;this.textContent=rimOn?"Rim: ON":"Rim: OFF";this.classList.toggle("on",rimOn);};
document.getElementById("bSnd").onclick=function(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;actx=new AC({sampleRate:22050});
    anode=actx.createScriptProcessor(512,0,1);
    anode.onaudioprocess=e=>{const o=e.outputBuffer.getChannelData(0);if(!sndOn){o.fill(0);return;}
      for(let s=0;s<o.length;s++){let sum=0;for(let vi=0;vi<8;vi++){const v=voices[vi],L=v.b.length,c0=v.b[v.p],c1=v.b[(v.p+1)%L];v.b[v.p]=((c0+c1)*253)>>9;v.p=(v.p+1)%L;sum+=c0;}o[s]=Math.max(-1,Math.min(1,sum/32768));}};
    anode.connect(actx.destination);
  }
  if(actx.state==="suspended")actx.resume();
  sndOn=!sndOn;this.textContent=sndOn?"SAS Synth: ON":"SAS Synth: OFF";this.classList.toggle("on",sndOn);if(sndOn)pluck(0);
};
function touch(cx0,cy0){
  const r=scr.getBoundingClientRect(),nx=Math.max(0,Math.min(0.99,(cx0-r.left)/r.width)),ny=Math.max(0,Math.min(0.99,(cy0-r.top)/r.height));
  const idx=((ny*4)|0)*4+((nx*4)|0);velY[idx]+=(((0.5-ny)*ONE)>>2);if(sndOn&&(tick&3)===0)pluck(idx);
}
scr.onpointerdown=e=>{down=true;touch(e.clientX,e.clientY);};
scr.onpointermove=e=>{if(down)touch(e.clientX,e.clientY);};
window.onpointerup=()=>{down=false;};
function loop(){
  for(let i=0;i<16;i++){const f=-(offY[i]>>5)-(velY[i]>>3);velY[i]+=f;offY[i]+=velY[i];}
  zB.fill(0x7FFFFFFF);for(let y=0;y<H;y++)idxB.fill((y*31/H)|0,y*W,(y+1)*W);
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    const i=r*4+c,wp=(tick*7+r*190+c*230)&1023,rp=(tick*5-r*140+c*170)&1023;
    grid[i].x=(((c-1.5)*1.15*ONE)|0)+(sinQ(rp)>>3);
    grid[i].y=(sinQ(wp)>>1)+(cosQ(rp)>>2)+offY[i];
    grid[i].z=(((r-1.5)*1.15*ONE)|0)+(cosQ(wp)>>3);
  }
  const ry=(tick*2)&1023,sy=sinQ(ry),cy0=cosQ(ry),sx=sinQ(220),cx0=cosQ(220),N=14,st=N+1,verts=[];
  for(let iv=0;iv<=N;iv++){const vq=((iv<<16)/N)|0;for(let iu=0;iu<=N;iu++){
    const uq=((iu<<16)/N)|0,pt=patch(grid,uq,vq);
    const x1=mul(cy0,pt.x)+mul(sy,pt.z),z1=mul(-sy,pt.x)+mul(cy0,pt.z);
    const y2=mul(cx0,pt.y)-mul(sx,z1),z2=mul(sx,pt.y)+mul(cx0,z1)+((4.4*ONE)|0);
    if(z2<=ONE){verts.push(null);continue;}
    const sxp=Number((BigInt(x1)*BigInt(300<<16))/BigInt(z2))>>16,syp=Number((BigInt(y2)*BigInt(300<<16))/BigInt(z2))>>16;
    verts.push({x:(sxp+240)|0,y:(syp+136)|0,z:z2,c:32+(((((iu+iv)*208/(N*2))|0)+(pt.y>>10))%208+208)%208});
  }}
  for(let iv=0;iv<N;iv++)for(let iu=0;iu<N;iu++){
    const a=verts[iv*st+iu],b=verts[iv*st+iu+1],d=verts[(iv+1)*st+iu],e=verts[(iv+1)*st+iu+1];
    if(a&&b&&d&&e){tri(a,b,e,rimOn);tri(a,e,d,rimOn);}
  }
  if(cycOn){const off=(tick>>1)%208;for(let k=0;k<208;k++)aPal[32+k]=bPal[32+((k+off)%208)];}
  for(let px=0;px<W*H;px++)out32[px]=aPal[idxB[px]];
  ctx.putImageData(img,0,0);cout32.set(aPal);cctx.putImageData(cimg,0,0);
  if((tick&7)===0)hud.textContent="LIVE | Frame: "+tick+" | Q16.16 Bezier + CLUT8 | Touch to Sculpt";
  tick++;requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
